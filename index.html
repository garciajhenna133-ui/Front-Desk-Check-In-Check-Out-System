<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front Desk Check-In & Check-Out System</title>
    <style>
        :root {
            --burgundy: #800020;
            --burgundy-light: #a02040;
            --burgundy-dark: #600018;
            --cream: #fdf6f8;
            --gold: #d4af37;
            --text-dark: #2c2c2c;
            --text-light: #666666;
            --avail: #e8f5e9;
            --avail-text: #2e7d32;
            --occ: #e3f2fd;
            --occ-text: #1565c0;
            --dirty: #ffebee;
            --dirty-text: #c62828;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(128, 0, 32, 0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background: linear-gradient(135deg, var(--cream) 0%, #f8e8ed 100%); min-height: 100vh; padding: 30px 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--burgundy); font-size: 28px; font-weight: 700; }
        .subtitle { color: var(--text-light); margin-top: 6px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab { padding: 14px 24px; background: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--text-dark); transition: all 0.3s; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .tab:hover { background: #f8e8ed; }
        .tab.active { background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-light) 100%); color: white; box-shadow: 0 4px 12px rgba(128,0,32,0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fade 0.3s ease; }
        @keyframes fade { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
        .card { background: white; border-radius: var(--radius); padding: 30px; box-shadow: var(--shadow); border-top: 4px solid var(--burgundy); margin-bottom: 25px; }
        h2 { color: var(--burgundy); font-size: 20px; margin-bottom: 25px; padding-bottom: 12px; border-bottom: 2px solid #f0e0e4; }
        .counters { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-bottom: 25px; }
        @media(max-width:600px) { .counters { grid-template-columns: 1fr; } }
        .counter-card { padding: 25px; border-radius: 10px; text-align: center; }
        .counter-avail { background: var(--avail); color: var(--avail-text); }
        .counter-occ { background: var(--occ); color: var(--occ-text); }
        .counter-dirty { background: var(--dirty); color: var(--dirty-text); }
        .counter-num { font-size: 32px; font-weight: 700; }
        .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; }
        .room-btn { padding: 18px 10px; border-radius: 10px; text-align: center; font-weight: 600; cursor: pointer; transition: transform 0.2s; border: 3px solid transparent; }
        .room-btn:hover { transform: scale(1.05); }
        .r-avail { background: var(--avail); border-color: var(--avail-text); color: var(--avail-text); }
        .r-occ { background: var(--occ); border-color: var(--occ-text); color: var(--occ-text); }
        .r-dirty { background: var(--dirty); border-color: var(--dirty-text); color: var(--dirty-text); }
        .legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
        .legend span { display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        label { display: block; margin: 18px 0 6px; font-weight: 600; color: var(--text-dark); font-size: 14px; }
        input, select { width: 100%; padding: 14px 16px; border: 2px solid #e8d0d8; border-radius: 8px; font-size: 15px; transition: border 0.3s; }
        input:focus, select:focus { outline: none; border-color: var(--burgundy); }
        .btn { padding: 15px 30px; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-light) 100%); color: white; width: 100%; margin-top: 24px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(128,0,32,0.3); }
        .btn-danger { background: linear-gradient(135deg, #c62828 0%, #e53935 100%); color: white; width: 100%; margin-top: 24px; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(198,40,40,0.3); }
        .info-box { padding: 20px; background: #fdf6f8; border-radius: 8px; border-left: 4px solid var(--gold); margin: 15px 0; }
        .log-item { padding: 14px 0; border-bottom: 1px solid #f0e0e4; }
        .log-item:last-child { border-bottom: none; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-right: 10px; }
        .badge-in { background: var(--avail); color: var(--avail-text); }
        .badge-out { background: var(--dirty); color: var(--dirty-text); }
        .empty { text-align: center; padding: 40px; color: var(--text-light); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1> Front Desk Check-In & Check-Out System</h1>
            <p class="subtitle"></p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="status">Room Status</button>
            <button class="tab" data-tab="checkin">Guest Check-In</button>
            <button class="tab" data-tab="checkout">Guest Check-Out</button>
            <button class="tab" data-tab="log">Activity Log</button>
        </div>

        <!-- Status Tab -->
        <div class="tab-content active" id="status">
            <div class="counters">
                <div class="counter-card counter-avail">
                    <div class="counter-num" id="avail">15</div>
                    <div>Available</div>
                </div>
                <div class="counter-card counter-occ">
                    <div class="counter-num" id="occ">0</div>
                    <div>Occupied</div>
                </div>
                <div class="counter-card counter-dirty">
                    <div class="counter-num" id="dirty">0</div>
                    <div>Dirty / Needs Cleaning</div>
                </div>
            </div>
            <div class="card">
                <h2>Room Status Board</h2>
                <div class="legend">
                    <span><span class="dot" style="background:var(--avail-text)"></span> Available</span>
                    <span><span class="dot" style="background:var(--occ-text)"></span> Occupied</span>
                    <span><span class="dot" style="background:var(--dirty-text)"></span> Dirty</span>
                </div>
                <div class="room-grid" id="roomGrid"></div>
            </div>
        </div>

        <!-- Check-In Tab -->
        <div class="tab-content" id="checkin">
            <div class="card">
                <h2>Guest Check-In</h2>
                <label>Select from Confirmed Reservations</label>
                <select id="bookingSelect">
                    <option value="">-- Select Reservation --</option>
                </select>
                <label>Or Enter Guest Name Manually</label>
                <input type="text" id="guestName" placeholder="Full Name">
                <label>Room Type</label>
                <select id="roomType" onchange="updateRoomNums()">
                    <option value="Standard">Standard (101–105)</option>
                    <option value="Deluxe">Deluxe (201–205)</option>
                    <option value="Executive">Executive (301–305)</option>
                </select>
                <label>Assign Room Number</label>
                <select id="roomNum">
                    <option value="">-- Select Room --</option>
                </select>
                <label>Check-In Date</label>
                <input type="date" id="inDate">
                <label>Expected Check-Out Date</label>
                <input type="date" id="outDate">
                <button class="btn btn-primary" onclick="doCheckIn()">✅ Confirm Check-In</button>
                <p id="inMsg" style="margin-top:15px;font-weight:600;"></p>
            </div>
        </div>

        <!-- Check-Out Tab -->
        <div class="tab-content" id="checkout">
            <div class="card">
                <h2>Guest Check-Out</h2>
                <label>Select Occupied Room</label>
                <select id="occupiedSelect" onchange="showGuest()">
                    <option value="">-- Select Room --</option>
                </select>
                <div class="info-box" id="guestInfo" style="display:none;"></div>
                <button class="btn btn-danger" onclick="doCheckOut()"> Confirm Check-Out</button>
                <p id="outMsg" style="margin-top:15px;font-weight:600;"></p>
            </div>
        </div>

        <!-- Log Tab -->
        <div class="tab-content" id="log">
            <div class="card">
                <h2>Activity Log</h2>
                <div id="logList"></div>
            </div>
        </div>
    </div>

    <script>
        const allRooms = [
            ...Array.from({length:5}, (_,i)=>({num:101+i,type:'Standard',status:'available'})),
            ...Array.from({length:5}, (_,i)=>({num:201+i,type:'Deluxe',status:'available'})),
            ...Array.from({length:5}, (_,i)=>({num:301+i,type:'Executive',status:'available'}))
        ];
        let stays = JSON.parse(localStorage.getItem('stays-fd')) || [];
        let logs = JSON.parse(localStorage.getItem('fd-log')) || [];
        const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('inDate').min = today;
        document.getElementById('outDate').min = today;

        // Tabs
        document.querySelectorAll('.tab').forEach(tab=>{
            tab.addEventListener('click',()=>{
                document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab).classList.add('active');
                if(tab.dataset.tab==='status') renderGrid();
                if(tab.dataset.tab==='checkin') loadBookings();
                if(tab.dataset.tab==='checkout') loadOccupied();
                if(tab.dataset.tab==='log') renderLog();
            });
        });

        function renderGrid() {
            const grid = document.getElementById('roomGrid');
            grid.innerHTML = allRooms.map(r=>{
                const occ = stays.find(s=>s.roomNum===r.num && s.status==='checked-in');
                let cls = 'r-avail', label = 'Available';
                if(occ){ cls='r-occ'; label=occ.name.split(' ')[0]; }
                else if(r.status==='dirty'){ cls='r-dirty'; label='Dirty'; }
                return `<div class="room-btn ${cls}">${r.num}<br><small>${label}</small></div>`;
            }).join('');
            const avail = allRooms.filter(r=>!stays.find(s=>s.roomNum===r.num && s.status==='checked-in') && r.status!=='dirty').length;
            const occCount = stays.filter(s=>s.status==='checked-in').length;
            const dirtyCount = allRooms.filter(r=>r.status==='dirty').length;
            document.getElementById('avail').textContent = avail;
            document.getElementById('occ').textContent = occCount;
            document.getElementById('dirty').textContent = dirtyCount;
        }

        function loadBookings() {
            const sel = document.getElementById('bookingSelect');
            const pending = bookings.filter(b=>!stays.find(s=>s.bookingId===b.id));
            sel.innerHTML = `<option value="">-- Select Reservation --</option>` +
                pending.map(b=>`<option value="${b.id}">${b.guestName} | ${b.roomType} | ${b.checkin}</option>`).join('');
            updateRoomNums();
        }

        function updateRoomNums() {
            const type = document.getElementById('roomType').value;
            const sel = document.getElementById('roomNum');
            const avail = allRooms.filter(r=>r.type===type && !stays.find(s=>s.roomNum===r.num && s.status==='checked-in') && r.status!=='dirty');
            sel.innerHTML = `<option value="">-- Select Room --</option>` +
                avail.map(r=>`<option value="${r.num}">Room ${r.num}</option>`).join('');
        }

        function doCheckIn() {
            const bookingId = document.getElementById('bookingSelect').value;
            const manualName = document.getElementById('guestName').value.trim();
            const roomNum = parseInt(document.getElementById('roomNum').value);
            const inD = document.getElementById('inDate').value;
            const outD = document.getElementById('outDate').value;
            const msg = document.getElementById('inMsg');
            let name = manualName;
            if(bookingId){
                const b = bookings.find(x=>x.id===parseInt(bookingId));
                if(b) name = b.guestName;
            }
            if(!name) return msg.textContent='⚠️ Enter name or select reservation',msg.style.color='var(--dirty-text)';
            if(!roomNum) return msg.textContent='⚠️ Select a room number',msg.style.color='var(--dirty-text)';
            if(!inD || !outD) return msg.textContent='⚠️ Fill in check-in and check-out dates',msg.style.color='var(--dirty-text)';
            if(new Date(outD)<=new Date(inD)) return msg.textContent='⚠️ Check-out must be after check-in',msg.style.color='var(--dirty-text)';
            if(stays.find(s=>s.roomNum===roomNum && s.status==='checked-in')) return msg.textContent='⚠️ Room is occupied',msg.style.color='var(--dirty-text)';
            
            const room = allRooms.find(r=>r.num===roomNum);
            if(room) room.status='occupied';
            stays.push({
                id: Date.now(),
                bookingId: bookingId?parseInt(bookingId):null,
                name,
                roomNum,
                roomType: document.getElementById('roomType').value,
                inDate: inD,
                outDate: outD,
                status: 'checked-in',
                time: new Date().toLocaleString()
            });
            save();
            addLog(`✅ CHECK-IN: ${name} | Room ${roomNum}`, 'in');
            
            // Reset
            document.getElementById('bookingSelect').value='';
            document.getElementById('guestName').value='';
            document.getElementById('roomNum').value='';
            document.getElementById('inDate').value='';
            document.getElementById('outDate').value='';
            
            msg.textContent='✅ Check-In Successful!'; msg.style.color='var(--avail-text)';
            setTimeout(()=>msg.textContent='',3000);
            renderGrid(); loadBookings();
        }

        function loadOccupied() {
            const sel = document.getElementById('occupiedSelect');
            const active = stays.filter(s=>s.status==='checked-in');
            sel.innerHTML = `<option value="">-- Select Room --</option>` +
                active.map(s=>`<option value="${s.id}">Room ${s.roomNum} — ${s.name}</option>`).join('');
            document.getElementById('guestInfo').style.display='none';
        }

        function showGuest() {
            const id = parseInt(document.getElementById('occupiedSelect').value);
            const info = document.getElementById('guestInfo');
            const s = stays.find(x=>x.id===id);
            if(s){
                info.style.display='block';
                info.innerHTML = `<strong>Guest:</strong> ${s.name}<br>
                <strong>Room:</strong> ${s.roomNum} (${s.roomType})<br>
                <strong>Check-In:</strong> ${s.inDate}<br>
                <strong>Expected Check-Out:</strong> ${s.outDate}`;
            } else info.style.display='none';
        }

        function doCheckOut() {
            const id = parseInt(document.getElementById('occupiedSelect').value);
            const msg = document.getElementById('outMsg');
            const idx = stays.findIndex(x=>x.id===id);
            if(idx===-1) return msg.textContent='⚠️ Select an occupied room',msg.style.color='var(--dirty-text)';
            const s = stays[idx];
            s.status='checked-out';
            s.outTime = new Date().toLocaleString();
            const room = allRooms.find(r=>r.num===s.roomNum);
            if(room) room.status='dirty';
            save();
            addLog(` CHECK-OUT: ${s.name} | Room ${s.roomNum} — marked for cleaning`, 'out');
            msg.textContent=' Check-Out Completed!'; msg.style.color='var(--avail-text)';
            setTimeout(()=>{msg.textContent='';document.getElementById('guestInfo').style.display='none'},3000);
            renderGrid(); loadOccupied();
        }

        function addLog(text, type){
            logs.unshift({text,type,time:new Date().toLocaleString()});
            localStorage.setItem('fd-log', JSON.stringify(logs));
            renderLog();
        }

        function renderLog(){
            const list = document.getElementById('logList');
            list.innerHTML = logs.length===0?`<p class="empty">No activity recorded.</p>`:
                logs.map(e=>`<div class="log-item"><span class="badge badge-${e.type}">${e.type==='in'?'CHECK-IN':'CHECK-OUT'}</span><strong>${e.text}</strong><br><small style="color:var(--text-light)">${e.time}</small></div>`).join('');
        }

        function save(){ localStorage.setItem('stays-fd', JSON.stringify(stays)); }

        renderGrid(); loadBookings(); renderLog();
    </script>
</body>
</html>
